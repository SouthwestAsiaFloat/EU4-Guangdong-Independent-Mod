权力与继任规则。\n\n<span class=\"cY\">查看本国制度<\/span>\n• 入口：<span class=\"cY\">政府页 → 一级改革<\/span>。\n• 本篇讲晋封、天子与特殊政体；阅读不会执行改革。", "links": [{"label": "爵制与晋封", "target": "promotion"}, {"label": "天子身份与王畿", "target": "tianzi"}, {"label": "公邑等特殊政体", "target": "special"}], "parent": "home", "status": "本国属于周天下；适用政体以政府页当前改革为准。", "outside": "本国在周天下之外；以下制度可供了解，不能直接套用。"}, {"key": "promotion", "title": "子、伯、侯、公：怎样请封晋爵（1/3）", "category": "court", "body": "<span class=\"cY\">请封晋爵<\/span>\n• 路线：<span class=\"cY\">子 → 伯 → 侯 → 公<\/span>。\n• 入口：天子外交页 → <span class=\"cY\">影响 → 请封晋爵<\/span>。\n\n<span class=\"cY\">三项同时满足：盟功／发展度／直属城市<\/span>\n• 子升伯：<span class=\"cB\">50／50／5<\/span>。\n• 伯升侯：<span class=\"cB\">100／100／10<\/span>。\n• 侯升公：<span class=\"cB\">200／200／20<\/span>。\n\n<span class=\"cY\">初封与复立<\/span>\n• 新成员从子起步；缩水不自动降爵。\n• 复国恢复灭亡前旧爵。\n• 主动背盟放弃旧爵，再入盟从子起步。", "links": [{"label": "下一页：申请限制", "target": "promotion_page2"}], "parent": "court", "status": "本国采用普通诸侯爵制；请封仍须满足对应门槛。", "outside": "本国未采用普通子、伯、侯、公改革；本页晋封入口暂不适用。"}, {"key": "promotion_page2", "title": "子、伯、侯、公：怎样请封晋爵（2/3）", "category": "court", "body": "<span class=\"cY\">申请限制<\/span>\n• 属国城市与未完成殖民地<span class=\"cR\">不计入门槛<\/span>。\n• <span class=\"cR\">不能与天子交战<\/span>，未结案不可重复提交。\n• 每<span class=\"cB\">二十五年<\/span>一届，每国最多申请<span class=\"cB\">一次<\/span>。\n• 拒绝、失败、成功均占用机会，<span class=\"cG\">不扣盟功<\/span>。\n\n<span class=\"cY\">爵位与国家等级<\/span>\n• 子、伯、侯：固定<span class=\"cB\">一级<\/span>；公：<span class=\"cB\">二级<\/span>。\n• 伯新增：年度威望<span class=\"cG\">+1<\/span>、外交关系上限<span class=\"cG\">+1<\/span>。\n• 侯、公继承伯国待遇，再获外交声誉<span class=\"cG\">+1<\/span>。", "links": [{"label": "下一页：普通诸侯的共同改革", "target": "promotion_page3"}, {"label": "上一页", "target": "promotion"}], "parent": "court", "status": "本国采用普通诸侯爵制；请封仍须满足对应门槛。", "outside": "本国未采用普通子、伯、侯、公改革；本页晋封入口暂不适用。"}, {"key": "promotion_page3", "title": "子、伯、侯、公：怎样请封晋爵（3/3）", "category": "court", "body": "<span class=\"cY\">普通诸侯的共同改革<\/span>\n• 贵族忠诚均衡：<span class=\"cG\">+10个百分点<\/span>。\n• 贵族影响力：<span class=\"cY\">+5个百分点<\/span>。\n• 年度正统性：<span class=\"cG\">+0.5<\/span>。\n• 稳定度花费：<span class=\"cG\">-10%<\/span>。", "links": [{"label": "上一页", "target": "promotion_page2"}, {"label": "天子裁可与诸侯表决", "target": "promotion_vote"}], "parent": "court", "status": "本国采用普通诸侯爵制；请封仍须满足对应门槛。", "outside": "本国未采用普通子、伯、侯、公改革；本页晋封入口暂不适用。"}, {"key": "promotion_vote", "title": "晋封程序：直接裁可与公议（1/2）", "category": "court", "body": "<span class=\"cY\">子升伯：天子直接裁可<\/span>\n• 天子批准后<span class=\"cG\">立即授爵<\/span>，不交列国表决。\n• 可与正在进行的天下公议<span class=\"cG\">同时处理<\/span>。\n\n<span class=\"cY\">伯升侯、侯升公：天下公议<\/span>\n• 公议须<span class=\"cB\">空闲<\/span>，且无待处理王命危机。\n• 天子受理后表决<span class=\"cB\">365日<\/span>，受理时不升爵。\n• 普通成员各<span class=\"cB\">一票<\/span>，含申请国与共和国。\n• 天子<span class=\"cR\">不额外投票<\/span>，也没有事后二次否决权。\n• 赞同须<span class=\"cB\">严格多于反对<\/span>，<span class=\"cR\">平票失败<\/span>。\n• 通过后直接晋封；所有申请均占本届一次机会。", "links": [{"label": "下一页：换届与未结案申请", "target": "promotion_vote_page2"}], "parent": "court", "status": "本国采用普通诸侯爵制；请封仍须满足对应门槛。", "outside": "本国未采用普通子、伯、侯、公改革；本页晋封入口暂不适用。"}, {"key": "promotion_vote_page2", "title": "晋封程序：直接裁可与公议（2/2）", "category": "court", "body": "<span class=\"cY\">换届与未结案申请<\/span>\n• 提交时保存本届成绩，供该次申请使用。\n• 跨届不会取消尚未结案的申请。\n• <span class=\"cR\">旧案未结时不能重复上书<\/span>。\n• <span class=\"cY\">公国<\/span>是普通晋封终点。\n• 当前<span class=\"cR\">没有由公国申请成为天子的路线<\/span>。", "links": [{"label": "上一页", "target": "promotion_vote"}, {"label": "盟功三本账", "target": "merit"}], "parent": "court", "status": "本国采用普通诸侯爵制；请封仍须满足对应门槛。", "outside": "本国未采用普通子、伯、侯、公改革；本页晋封入口暂不适用。"}, {"key": "tianzi", "title": "周天子：王畿奉养，列国共尊（1/2）", "category": "court", "body": "<span class=\"cY\">周天子政府机制<\/span>\n• 固定<span class=\"cB\">帝国等级<\/span>，世袭君主政体，使用<span class=\"cY\">正统性<\/span>。\n• 天子身份<span class=\"cR\">不由普通晋封或七大诸侯排名授予<\/span>。\n\n<span class=\"cY\">改革收益与权力<\/span>\n• 外交关系：<span class=\"cG\">+2<\/span>。\n• 改善关系：<span class=\"cG\">+20%<\/span>。\n• 贵族忠诚均衡：<span class=\"cG\">+10个百分点<\/span>。\n• 贵族影响力：<span class=\"cY\">+5个百分点<\/span>。\n• 年度威望：<span class=\"cG\">+0.5<\/span>。\n• 年度正统性：<span class=\"cG\">+0.5<\/span>。", "links": [{"label": "下一页：天子禁卫", "target": "tianzi_page2"}], "parent": "court", "status": "本国为当前天子；改革收益须由实际政府改革提供。", "outside": "本国不是当前天子；本页介绍天子专属制度。"}, {"key": "tianzi_page2", "title": "周天子：王畿奉养，列国共尊（2/2）", "category": "court", "body": "<span class=\"cY\">天子禁卫<\/span>\n• 兵种：<span class=\"cY\">限额特殊步兵<\/span>，在<span class=\"cY\">陆军界面<\/span>招募。\n• 基础限额：<span class=\"cB\">六团<\/span>。\n• 维护费比普通部队：<span class=\"cR\">+20%<\/span>。\n• 火力伤害：<span class=\"cG\">+50%<\/span>。\n• 冲击伤害：<span class=\"cG\">+50%<\/span>。\n• 须启用<span class=\"cB\">Domination<\/span>支持的特殊部队内容。\n\n<span class=\"cY\">王畿与后续成长<\/span>\n• 王畿仅限<span class=\"cY\">开封、洛阳<\/span>。\n• 须由<span class=\"cB\">采用该改革的天子持有<\/span>。\n• 王畿本地税收：<span class=\"cG\">+50%<\/span>。\n• 提高禁卫限额的后续成长路线<span class=\"cR\">尚未开放<\/span>。", "links": [{"label": "上一页", "target": "tianzi"}, {"label": "朝会与天下事务", "target": "council"}], "parent": "court", "status": "本国为当前天子；改革收益须由实际政府改革提供。", "outside": "本国不是当前天子；本页介绍天子专属制度。"}, {"key": "special", "title": "特殊政体：爵制之外的朝廷", "category": "court", "body": "<span class=\"cY\">不同的执政方式<\/span>\n• <span class=\"cY\">公邑<\/span>：一城自治。\n• <span class=\"cY\">扬国商盟<\/span>：经营商业与外交网络。\n• <span class=\"cY\">潮州乡贤议会<\/span>：士绅与统治者分配权力。\n• <span class=\"cY\">客家革命军政府<\/span>：派系与共和传统决定去向。\n\n<span class=\"cY\">资格与查看入口<\/span>\n• 上述政体可有周天下成员身份。\n• 成员身份<span class=\"cR\">不会自动授予普通君主晋封资格<\/span>。\n• 当前制度：<span class=\"cY\">政府页 → 一级改革<\/span>。\n• 公邑有申请入口；其他专属政体另有国家与改革资格。\n• 阅读不会切换本国制度。", "links": [{"label": "公邑：申请与一城边界", "target": "gongyi"}, {"label": "扬国商盟", "target": "yang"}, {"label": "乡贤议会与革命军政府", "target": "republics"}], "parent": "court", "status": "本国属于周天下；适用政体以政府页当前改革为准。", "outside": "本国在周天下之外；以下制度可供了解，不能直接套用。"}, {"key": "gongyi", "title": "公邑：一城自治的代价（1/3）", "category": "court", "body": "<span class=\"cY\">公邑自治制<\/span>\n• 仅能持有<span class=\"cB\">一个直属省份<\/span>。\n• 任期：<span class=\"cB\">四年选举<\/span>。\n• 可经营<span class=\"cY\">贸易联盟<\/span>与<span class=\"cY\">贸易城市<\/span>。\n• 发展成本：<span class=\"cG\">-20%<\/span>。\n• 贸易效率：<span class=\"cG\">+10%<\/span>。\n• 要塞防御：<span class=\"cG\">+20%<\/span>。", "links": [{"label": "下一页：请授公邑：全部条件", "target": "gongyi_page2"}], "parent": "special", "status": "本国采用公邑改革，须守一省边界。", "outside": "本国未采用公邑改革；申请须满足本页全部资格。"}, {"key": "gongyi_page2", "title": "公邑：一城自治的代价（2/3）", "category": "court", "body": "<span class=\"cY\">请授公邑：全部条件<\/span>\n• 入口：天子外交页 → <span class=\"cY\">请授公邑<\/span>。\n• 须为<span class=\"cB\">独立的一省共和国<\/span>。\n• 已加入<span class=\"cB\">周天下<\/span>。\n• 须处于<span class=\"cB\">和平<\/span>。\n• 天子对本国好感<span class=\"cB\">至少100<\/span>。\n• 扬国<span class=\"cR\">不走此申请入口<\/span>。", "links": [{"label": "下一页：裁可与失格", "target": "gongyi_page3"}, {"label": "上一页", "target": "gongyi"}], "parent": "special", "status": "本国采用公邑改革，须守一省边界。", "outside": "本国未采用公邑改革；申请须满足本页全部资格。"}, {"key": "gongyi_page3", "title": "公邑：一城自治的代价（3/3）", "category": "court", "body": "<span class=\"cY\">裁可与失格<\/span>\n• 申请冷却<span class=\"cB\">一年<\/span>，天子直接裁可，不经投票。\n• 拥有第二省：<span class=\"cR\">失去公邑改革，转为普通共和国<\/span>。\n• 保留现任人物、共和传统与稳定。\n• 缩回一省<span class=\"cR\">不会自动恢复公邑<\/span>，须重新申请。\n• 贸易联盟地位仍受原生规则约束。", "links": [{"label": "上一页", "target": "gongyi_page2"}], "parent": "special", "status": "本国采用公邑改革，须守一省边界。", "outside": "本国未采用公邑改革；申请须满足本页全部资格。"}, {"key": "yang", "title": "扬国商盟：以市镇组织国势（1/2）", "category": "court", "body": "<span class=\"cY\">扬国商盟共和制<\/span>\n• 商业共和国，<span class=\"cB\">四年选举<\/span>。\n• 可以组织<span class=\"cY\">贸易联盟<\/span>与<span class=\"cY\">贸易城市<\/span>。\n\n<span class=\"cY\">收益与代价<\/span>\n• 商人：<span class=\"cG\">+2<\/span>。\n• 外交声誉：<span class=\"cG\">+1<\/span>。\n• 改善关系：<span class=\"cG\">+20%<\/span>。\n• 雇佣兵训练度：<span class=\"cG\">+5%<\/span>。\n• 治理容量：<span class=\"cR\">-80%<\/span>。", "links": [{"label": "下一页：领土与贸易城市", "target": "yang_page2"}], "parent": "special", "status": "本国采用扬国商盟改革。", "outside": "本国未采用扬国商盟改革；以下为该专属政体规则。"}, {"key": "yang_page2", "title": "扬国商盟：以市镇组织国势（2/2）", "category": "court", "body": "<span class=\"cY\">领土与贸易城市<\/span>\n• 不受公邑一省限制，开局三省不因此退化。\n• 扩张仍须承担低治理容量的负担。\n• 贸易城市<span class=\"cR\">不能从本国首都释放<\/span>。\n• 同一联盟在同一节点<span class=\"cR\">只能释放一个贸易城市<\/span>。\n• 入口：<span class=\"cY\">贸易联盟与省份界面<\/span>。\n• 成员加入、退出和领袖变更，按原生规则处理。", "links": [{"label": "上一页", "target": "yang"}], "parent": "special", "status": "本国采用扬国商盟改革。", "outside": "本国未采用扬国商盟改革；以下为该专属政体规则。"}, {"key": "republics", "title": "乡贤议会与军府：权力如何转移（1/3）", "category": "court", "body": "<span class=\"cY\">潮州乡贤议会<\/span>\n• <span class=\"cY\">终身执政者<\/span>，原生议会与士绅—统治者权力条。\n• 入口：<span class=\"cY\">政府页 → 议政<\/span>。\n• 每次花费<span class=\"cR\">50行政点<\/span>。\n• 每次推动权力条<span class=\"cB\">0.10<\/span>。\n• 两方向共享<span class=\"cB\">一年冷却<\/span>。\n• 共和传统<span class=\"cB\">严格低于20<\/span>时，触发<span class=\"cY\">称王<\/span>。", "links": [{"label": "下一页：客家革命军政府", "target": "republics_page2"}], "parent": "special", "status": "本国采用本页介绍的一种专属共和国改革。", "outside": "本国未采用这几种专属共和国改革；内容可供了解。"}, {"key": "republics_page2", "title": "乡贤议会与军府：权力如何转移（2/3）", "category": "court", "body": "<span class=\"cY\">客家革命军政府<\/span>\n• <span class=\"cY\">终身执政、将领接班<\/span>。\n• 支持乡社花费：<span class=\"cR\">10行政点<\/span>。\n• 支持乡社结果：乡社影响力<span class=\"cY\">+10<\/span>。\n• 支持工商花费：<span class=\"cR\">10外交点<\/span>。\n• 支持工商结果：工商影响力<span class=\"cY\">+10<\/span>。\n• 支持军府花费：<span class=\"cR\">10军事点<\/span>。\n• 支持军府结果：军府影响力<span class=\"cY\">+10<\/span>。\n• 战争每月额外提高军府影响力<span class=\"cY\">0.20<\/span>。\n• <span class=\"cY\">乡勇约法<\/span>将上述战时增长减半。", "links": [{"label": "下一页：还政与称王", "target": "republics_page3"}, {"label": "上一页", "target": "republics"}], "parent": "special", "status": "本国采用本页介绍的一种专属共和国改革。", "outside": "本国未采用这几种专属共和国改革；内容可供了解。"}, {"key": "republics_page3", "title": "乡贤议会与军府：权力如何转移（3/3）", "category": "court", "body": "<span class=\"cY\">还政与称王<\/span>\n• 还政条件：<span class=\"cB\">乡社占优<\/span>。\n• 还政条件：<span class=\"cB\">和平<\/span>。\n• 还政条件：共和传统<span class=\"cB\">至少60<\/span>。\n• 入口：<span class=\"cY\">政府页或还政决议<\/span>。\n• 还政后转为<span class=\"cY\">乡社共和国<\/span>，<span class=\"cB\">四年选举<\/span>。\n• 两种客家共和国：<span class=\"cB\">军府占优<\/span>且传统<span class=\"cB\">低于20<\/span>，触发<span class=\"cY\">称王<\/span>。", "links": [{"label": "上一页", "target": "republics_page2"}], "parent": "special", "status": "本国采用本页介绍的一种专属共和国改革。", "outside": "本国未采用这几种专属共和国改革；内容可供了解。"}, {"key": "religion", "title": "宗教：礼教之下，百家各言其道", "category": "lijiao", "body": "<span class=\"cY\">礼教与百家<\/span>\n• <span class=\"cY\">礼教<\/span>是名分、礼仪与治国责任的共同框架。\n• 儒、法、墨、道、兵、纵横分别提出治国路线。\n• 六家不是六种需要互相传教的省份宗教。\n<span class=\"cY\">三种不同的存在<\/span>\n• <span class=\"cY\">主学派<\/span>：决定国内践履准则与收益。\n• <span class=\"cY\">第二学派<\/span>：有期限的宾学，或更张后的旧学余势。\n• <span class=\"cY\">学宫<\/span>：位于省份上的思想机构。\n<span class=\"cY\">天下显学与本篇范围<\/span>\n• <span class=\"cY\">天下显学<\/span>由大辩决定，只改变国际评价。\n• 完整大辩规则在<span class=\"cY\">周天下<\/span>篇。\n• 本篇重点介绍礼教；其余宗教沿用各自规则。", "links": [{"label": "首次立论与践履", "target": "practice"}, {"label": "六家对照与详细准则", "target": "schools_a"}, {"label": "第二学派：延请与履约", "target": "guest"}, {"label": "更张国论", "target": "reform"}], "parent": "home", "status": "本国适用礼教机制；各项操作另有资格与冷却。", "outside": "本国当前不适用礼教国论机制；仍可查阅全部规则。"}, {"key": "practice", "title": "践履：让国论成为实政（1/3）", "category": "lijiao", "body": "<span class=\"cY\">首次立论<\/span>\n• 入口：<span class=\"cY\">召集诸子百家<\/span>。\n• 资格：礼教国，<span class=\"cB\">尚无主学派<\/span>。\n• 首次践履：<span class=\"cB\">25<\/span>。\n• 首次采用后<span class=\"cB\">十年<\/span>不能更张。\n• 已有主学派<span class=\"cR\">不能重走首次入口<\/span>。", "links": [{"label": "下一页：践履四档", "target": "practice_page2"}], "parent": "religion", "status": "本国适用礼教机制；各项操作另有资格与冷却。", "outside": "本国当前不适用礼教国论机制；仍可查阅全部规则。"}, {"key": "practice_page2", "title": "践履：让国论成为实政（2/3）", "category": "lijiao", "body": "<span class=\"cY\">践履四档<\/span>\n• 范围<span class=\"cB\">0至100<\/span>，<span class=\"cB\">每年<\/span>按实际国情结算。\n• <span class=\"cB\">0至24<\/span>：<span class=\"cY\">名实未副<\/span>，承受本派<span class=\"cR\">反噬<\/span>。\n• <span class=\"cB\">25至49<\/span>：<span class=\"cY\">试行<\/span>。\n• <span class=
